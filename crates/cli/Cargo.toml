[package]
name = "hackai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hackai-paths = { path = "../paths" }
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hackai-parser = { path = "../parser" }
hackai-scorer = { path = "../scorer" }
hackai-schema = { path = "../schema" }
hackai-gitx = { path = "../gitx" }
dialoguer = "0.11"
dirs = "5.0"
keyring = "4.2"
uuid = { version = "1.8", features = ["serde", "v4"] }
tokio = { version = "1.38", features = ["rt", "macros"] }
sha2 = "0.10"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
ratatui = "0.29"
crossterm = "0.28"
# Apache-2.0 OR MIT; used locally for bounded structural prompt rules.
regex = "1.11"
[lints]
workspace = true
