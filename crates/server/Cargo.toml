[package]
name = "hackai-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tower = { version = "0.5", features = ["limit", "timeout", "load-shed"] }
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace", "cors"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "json", "macros"] }
jsonwebtoken = "9.3"
base64 = "0.22"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
[lints]
workspace = true
