name: Release CLI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: hackai-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: hackai-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hackai-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hackai-aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig (for Linux targets)
        if: matrix.target != 'aarch64-apple-darwin' && matrix.target != 'x86_64-apple-darwin'
        run: |
          sudo apt-get update && sudo apt-get install -y zig

      - name: Install cargo-zigbuild (for Linux targets)
        if: matrix.target != 'aarch64-apple-darwin' && matrix.target != 'x86_64-apple-darwin'
        run: cargo install cargo-zigbuild

      - name: Build CLI
        run: |
          if [[ "${{ matrix.target }}" == *"linux"* ]]; then
            cargo zigbuild --release -p hackai --target ${{ matrix.target }}
          else
            cargo build --release -p hackai --target ${{ matrix.target }}
          fi

      - name: Verify binary
        run: |
          ./target/${{ matrix.target }}/release/hackai --version

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/hackai dist/${{ matrix.artifact }}
          cd dist
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hackai-*
          merge-multiple: true
          path: dist

      - name: Create checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}