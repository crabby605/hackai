name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hackai-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hackai-linux-aarch64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: hackai-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: hackai-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: hackai-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.cross == 'true'
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        if: matrix.cross != 'true'
        run: cargo build --release --no-default-features --bin hackai --target ${{ matrix.target }}

      - name: Cross build
        if: matrix.cross == 'true'
        run: cross build --release --no-default-features --bin hackai --target ${{ matrix.target }}

      - name: Package binaries (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist/archives/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/hackai dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/hackai dist/archives/${{ matrix.artifact }}/hackai
          tar -czf dist/archives/${{ matrix.artifact }}.tar.gz -C dist/archives/${{ matrix.artifact }} hackai
          sha256sum dist/${{ matrix.artifact }} | awk '{print $1}' > dist/${{ matrix.artifact }}.sha256
          sha256sum dist/archives/${{ matrix.artifact }}.tar.gz | awk '{print $1}' > dist/archives/${{ matrix.artifact }}.tar.gz.sha256

      - name: Package binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p dist/archives/hackai-windows-x86_64
          cp target/${{ matrix.target }}/release/hackai.exe dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/hackai.exe dist/archives/hackai-windows-x86_64/hackai.exe
          7z a dist/archives/hackai-windows-x86_64.zip dist/archives/hackai-windows-x86_64/hackai.exe
          powershell -NoProfile -Command "(Get-FileHash 'dist\\${{ matrix.artifact }}' -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii 'dist\\${{ matrix.artifact }}.sha256'; (Get-FileHash 'dist\\archives\\hackai-windows-x86_64.zip' -Algorithm SHA256).Hash.ToLower() | Out-File -Encoding ascii 'dist\\archives\\hackai-windows-x86_64.zip.sha256'"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.version || github.ref_name, '-') }}

  publish-installer:
    name: Publish Installer
    needs: release
    runs-on: ubuntu-latest
    if: always() && needs.release.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare installer
        run: |
          VERSION='${{ inputs.version || github.ref_name }}'
          sed -i "s|REPO=\"hackclub/hackai\"|REPO=\"${{ github.repository }}\"|g" scripts/install-cli.sh
          sed -i "s|https://your-domain.com/install-cli.sh|https://github.com/${{ github.repository }}/releases/download/${VERSION}/install-cli.sh|g" scripts/install-cli.sh

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: scripts/install-cli.sh
          tag_name: ${{ inputs.version || github.ref_name }}
