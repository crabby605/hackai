name: Release CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: hackai-linux-x86_64
          # Native arm64 runner: no cross/Docker needed.
          # If your repo is private and can't use it, switch back to ubuntu-latest + cross.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: hackai-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: hackai-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: hackai-macos-aarch64
          # Native Windows runner - bundled SQLite works out of the box
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: hackai-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify tag matches Cargo version
        shell: bash
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          CRATE=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(any(.targets[]; .name == "hackai")) | .version' \
            | head -n1)
          if [ "v$CRATE" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo version v$CRATE"
            exit 1
          fi

      - name: Build
        run: cargo build --release --no-default-features --bin hackai --target ${{ matrix.target }}

      - name: Package binaries (Unix)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          mkdir -p dist/archives/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/hackai dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/hackai dist/archives/${{ matrix.artifact }}/hackai
          tar -czf dist/archives/${{ matrix.artifact }}.tar.gz -C dist/archives/${{ matrix.artifact }} hackai

      - name: Package binaries (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          # Install 7zip on Windows
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          $artifact = "${{ matrix.artifact }}"
          $distDir = "dist"
          $archivesDir = "dist/archives/hackai-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $archivesDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/hackai.exe" "$distDir/$artifact"
          Copy-Item "target/${{ matrix.target }}/release/hackai.exe" "$archivesDir/hackai.exe"
          & 7z a "$distDir/archives/hackai-windows-x86_64.zip" "$archivesDir/hackai.exe"

      - name: Generate checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            SHA="sha256sum"
          else
            SHA="shasum -a 256"
          fi
          find dist -type f ! -name '*.sha256' | while read -r f; do
            $SHA "$f" | awk '{print $1}' > "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -laR dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          tag_name: ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.version || github.ref_name, '-') }}

  publish-installer:
    name: Publish Installer
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Prepare installer
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          sed -i "s|REPO=\"hackclub/hackai\"|REPO=\"${REPO}\"|g" scripts/install-cli.sh
          sed -i "s|https://your-domain.com/install-cli.sh|https://github.com/${REPO}/releases/download/${VERSION}/install-cli.sh|g" scripts/install-cli.sh

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: scripts/install-cli.sh
          tag_name: ${{ inputs.version || github.ref_name }}
