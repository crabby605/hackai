[workspace]
members = [
  "crates/schema", "crates/paths", "crates/scorer", "crates/parser",
  "crates/gitx", "crates/cli", "crates/server"
]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hackclub/hackai"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
unicode-normalization = "0.1"
proptest = "1.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
